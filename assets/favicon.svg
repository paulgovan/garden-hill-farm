<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Gable-end red barn, modeled on the barn at Garden Hill Farm -->
  <defs>
    <clipPath id="wall"><path d="M4 35 32 15l28 20v21H4Z"/></clipPath>
  </defs>
  <!-- Wall -->
  <path d="M4 35 32 15l28 20v21H4Z" fill="#a8322b"/>
  <!-- Board siding -->
  <g clip-path="url(#wall)" stroke="#86271f" stroke-width="0.9" opacity="0.6">
    <path d="M0 22h64M0 27h64M0 32h64M0 37h64M0 42h64M0 47h64M0 52h64"/>
  </g>
  <!-- Door-bay trim with clipped corners -->
  <g fill="none" stroke="#e08a7c" stroke-width="1.6" stroke-linejoin="round">
    <path d="M21 56V40l3-3h16l3 3v16"/>
    <path d="M7 56V45l2.5-2.5h7L19 45v11"/>
    <path d="M45 56V45l2.5-2.5h7L57 45v11"/>
  </g>
  <!-- Closed outer doors (center seam) -->
  <path d="M13 44v12M51 44v12" stroke="#86271f" stroke-width="1.2"/>
  <!-- Large open center bay -->
  <path d="M24.5 40.5h15V56h-15Z" fill="#2e2320"/>
  <!-- Arched vent near the peak -->
  <path d="M29.5 29v-3.5a2.5 2.5 0 0 1 5 0V29Z" fill="#5a2620"/>
  <!-- Roof edge -->
  <path d="M1.5 36.5 32 14.5l30.5 22" fill="none" stroke="#5a2620" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ground -->
  <path d="M2 57.5h60" stroke="#6f8a5a" stroke-width="3" stroke-linecap="round"/>
</svg>
